
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タスク管理 | クリニック管理システム</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px;
      font-family: "Yu Gothic", "Meiryo", sans-serif;
      background: #f3f6f5;
      color: #263b37;
    }

    .container { max-width: 1000px; margin: auto; }

    header, .card {
      background: white;
      padding: 22px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px #0000000a;
    }

    h1 { margin-top: 0; font-size: 26px; }
    h2 { font-size: 19px; margin-top: 0; }
    .note { color: #657570; font-size: 13px; line-height: 1.7; }

    a { color: #176b5b; }

    label {
      display: block;
      font-size: 14px;
      margin: 12px 0 6px;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      padding: 11px;
      border: 1px solid #ccd7d3;
      border-radius: 7px;
      font: inherit;
      background: white;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    button {
      border: 0;
      border-radius: 7px;
      padding: 10px 14px;
      cursor: pointer;
      font: inherit;
      background: #e8efec;
      color: #263b37;
      margin: 5px 4px 5px 0;
    }

    button.primary { background: #173b35; color: white; }
    button.danger { background: #fff0ee; color: #a32f25; }

    .filters {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .task {
      border: 1px solid #e0e8e4;
      border-radius: 9px;
      padding: 16px;
      margin-top: 12px;
      background: white;
    }

    .task.done { opacity: 0.7; }
    .task.done .task-name { text-decoration: line-through; }

    .task-name { font-weight: bold; font-size: 17px; }
    .task-meta { font-size: 13px; color: #657570; line-height: 1.8; margin-top: 8px; }
    .task-actions { margin-top: 10px; }

    .status { font-weight: bold; font-size: 12px; }
    .empty { color: #657570; padding: 18px 0; }

    @media (max-width: 650px) {
      body { padding: 12px; }
      .form-grid, .filters { grid-template-columns: 1fr; }
      header, .card { padding: 16px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <p><a href="../index.html">← メインダッシュボードへ戻る</a></p>
      <h1>タスク管理</h1>
      <p class="note">
        クリニック開業準備の業務を登録し、期限・担当者・進捗を管理します。
      </p>
    </header>

    <section class="card">
      <h2 id="form-title">新しいタスクを追加</h2>
      <form id="task-form">
        <div class="form-grid">
          <div>
            <label for="task-name">業務名 *</label>
            <input id="task-name" maxlength="100" required
              placeholder="例：消防設備の確認">
          </div>
          <div>
            <label for="task-deadline">期限</label>
            <input id="task-deadline" type="date">
          </div>
          <div>
            <label for="task-category">カテゴリ</label>
            <select id="task-category">
              <option>開業手続き</option>
              <option>物件・設備</option>
              <option>医療機器・システム</option>
              <option>人事・採用</option>
              <option>行政・届出</option>
              <option>経理・資金</option>
              <option>広報・集患</option>
              <option>その他</option>
            </select>
          </div>
          <div>
            <label for="task-priority">優先度</label>
            <select id="task-priority">
              <option>高</option>
              <option selected>中</option>
              <option>低</option>
            </select>
          </div>
          <div>
            <label for="task-assignee">担当者</label>
            <input id="task-assignee" maxlength="100" placeholder="例：事務長">
          </div>
        </div>
        <button class="primary" type="submit" id="submit-button">＋ タスクを追加する</button>
        <button type="button" id="cancel-edit" hidden>編集をキャンセル</button>
      </form>
    </section>

    <section class="card">
      <h2>タスクの絞り込み</h2>
      <div class="filters">
        <div>
          <label for="category-filter">カテゴリ</label>
          <select id="category-filter">
            <option value="all">すべて</option>
            <option>開業手続き</option>
            <option>物件・設備</option>
            <option>医療機器・システム</option>
            <option>人事・採用</option>
            <option>行政・届出</option>
            <option>経理・資金</option>
            <option>広報・集患</option>
            <option>その他</option>
          </select>
        </div>
        <div>
          <label for="status-filter">進捗</label>
          <select id="status-filter">
            <option value="all">すべて</option>
            <option value="unfinished">未完了</option>
            <option value="done">完了</option>
          </select>
        </div>
        <div>
          <label for="task-sort">並び順</label>
          <select id="task-sort">
            <option value="default">登録順</option>
            <option value="priority">優先度順</option>
            <option value="deadline">期限が早い順</option>
            <option value="unfinished">未完了を先に表示</option>
          </select>
        </div>
      </div>
    </section>

    <section class="card">
      <h2>タスク一覧</h2>
      <p id="task-summary" class="note"></p>
      <div id="task-list"></div>
    </section>

    <p class="note">
      ※ 試作版です。データはこのブラウザのローカルストレージに保存されます。
      実際の患者情報など、機密情報は入力しないでください。
    </p>
  </div>

  <script>
    const STORAGE_KEY = "clinicAdminTasks";
    const form = document.getElementById("task-form");
    const taskList = document.getElementById("task-list");
    const summary = document.getElementById("task-summary");

    let tasks = [];
    let editingId = null;

    // 保存済みデータを読み込む
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      const parsed = saved ? JSON.parse(saved) : [];
      tasks = Array.isArray(parsed) ? parsed : [];
    } catch (error) {
      tasks = [];
      alert("保存データを読み込めませんでした。既存データは削除していません。");
    }

    function saveTasks() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
        return true;
      } catch (error) {
        alert("保存できませんでした。ブラウザの保存設定を確認してください。");
        return false;
      }
    }

    function getTaskId(task) {
      return task.id ?? task.taskId;
    }

    function isDone(task) {
      return task.done === true || task.completed === true || task.status === "done";
    }

    function getPriority(task) {
      return task.priority || "中";
    }

    function getDeadline(task) {
      return task.deadline || "";
    }

    function getName(task) {
      return task.name || task.title || "名称未設定";
    }

    function renderTasks() {
      const category = document.getElementById("category-filter").value;
      const status = document.getElementById("status-filter").value;
      const sort = document.getElementById("task-sort").value;

      let visible = tasks.filter(task => {
        if (category !== "all" && (task.category || "その他") !== category) return false;
        if (status === "unfinished" && isDone(task)) return false;
        if (status === "done" && !isDone(task)) return false;
        return true;
      });

      const priorityOrder = { "高": 0, "中": 1, "低": 2 };

      if (sort === "priority") {
        visible.sort((a, b) =>
          (priorityOrder[getPriority(a)] ?? 1) -
          (priorityOrder[getPriority(b)] ?? 1)
        );
      } else if (sort === "deadline") {
        visible.sort((a, b) =>
          (getDeadline(a) || "9999-12-31").localeCompare(
            getDeadline(b) || "9999-12-31"
          )
        );
      } else if (sort === "unfinished") {
        visible.sort((a, b) => Number(isDone(a)) - Number(isDone(b)));
      }

      const completed = tasks.filter(isDone).length;
      summary.textContent =
        `登録 ${tasks.length}件 ／ 完了 ${completed}件 ／ 未完了 ${tasks.length - completed}件`;

      taskList.replaceChildren();

      if (visible.length === 0) {
        const empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = "表示するタスクはありません。";
        taskList.appendChild(empty);
        return;
      }

      visible.forEach(task => {
        const card = document.createElement("article");
        card.className = "task" + (isDone(task) ? " done" : "");

        const name = document.createElement("div");
        name.className = "task-name";
        name.textContent = getName(task);
        card.appendChild(name);

        const meta = document.createElement("div");
        meta.className = "task-meta";
        meta.textContent =
          `カテゴリ：${task.category || "その他"} ／ 優先度：${getPriority(task)} ／ 期限：${getDeadline(task) || "未設定"} ／ 担当者：${task.assignee || "未設定"}`;
        card.appendChild(meta);

        const statusText = document.createElement("p");
        statusText.className = "status";
        statusText.textContent = isDone(task) ? "✓ 完了" : "未完了";
        card.appendChild(statusText);

        const actions = document.createElement("div");
        actions.className = "task-actions";

        const toggleButton = document.createElement("button");
        toggleButton.textContent = isDone(task) ? "未完了に戻す" : "完了にする";
        toggleButton.addEventListener("click", () => toggleTask(task));
        actions.appendChild(toggleButton);

        const editButton = document.createElement("button");
        editButton.textContent = "編集";
        editButton.addEventListener("click", () => startEdit(task));
        actions.appendChild(editButton);

        const deleteButton = document.createElement("button");
        deleteButton.className = "danger";
        deleteButton.textContent = "削除";
        deleteButton.addEventListener("click", () => deleteTask(task));
        actions.appendChild(deleteButton);

        card.appendChild(actions);
        taskList.appendChild(card);
      });
    }

    function toggleTask(task) {
      const oldDone = isDone(task);
      if ("completed" in task && !("done" in task)) {
        task.completed = !oldDone;
      } else if ("status" in task && !("done" in task)) {
        task.status = oldDone ? "todo" : "done";
      } else {
        task.done = !oldDone;
      }

      if (saveTasks()) renderTasks();
    }

    function startEdit(task) {
      editingId = getTaskId(task);
      document.getElementById("task-name").value = getName(task);
      document.getElementById("task-deadline").value = getDeadline(task);
      document.getElementById("task-category").value = task.category || "その他";
      document.getElementById("task-priority").value = getPriority(task);
      document.getElementById("task-assignee").value = task.assignee || "";
      document.getElementById("form-title").textContent = "タスクを編集";
      document.getElementById("submit-button").textContent = "変更を保存";
      document.getElementById("cancel-edit").hidden = false;
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function resetForm() {
      editingId = null;
      form.reset();
      document.getElementById("form-title").textContent = "新しいタスクを追加";
      document.getElementById("submit-button").textContent = "＋ タスクを追加する";
      document.getElementById("cancel-edit").hidden = true;
    }

    document.getElementById("cancel-edit").addEventListener("click", resetForm);

    form.addEventListener("submit", event => {
      event.preventDefault();

      const name = document.getElementById("task-name").value.trim();
      if (!name) return;

      const fields = {
        name,
        deadline: document.getElementById("task-deadline").value,
        category: document.getElementById("task-category").value,
        priority: document.getElementById("task-priority").value,
        assignee: document.getElementById("task-assignee").value.trim()
      };

      if (editingId !== null) {
        const index = tasks.findIndex(task => getTaskId(task) === editingId);
        if (index !== -1) {
          tasks[index] = { ...tasks[index], ...fields };
        } else {
          alert("編集対象のタスクが見つかりませんでした。");
          resetForm();
          return;
        }
      } else {
        tasks.push({
          id: (window.crypto && crypto.randomUUID)
            ? crypto.randomUUID()
            : String(Date.now()) + Math.random().toString(16).slice(2),
          ...fields,
          done: false
        });
      }

      if (saveTasks()) {
        resetForm();
        renderTasks();
      }
    });

    function deleteTask(task) {
      if (!confirm(`「${getName(task)}」を削除しますか？`)) return;
      const id = getTaskId(task);
      const index = tasks.findIndex(item => getTaskId(item) === id);
      if (index === -1) return;

      const removed = tasks.splice(index, 1);
      if (!saveTasks()) {
        tasks.splice(index, 0, ...removed);
        return;
      }
      if (editingId === id) resetForm();
      renderTasks();
    }

    document.getElementById("category-filter").addEventListener("change", renderTasks);
    document.getElementById("status-filter").addEventListener("change", renderTasks);
    document.getElementById("task-sort").addEventListener("change", renderTasks);

    renderTasks();
  </script>
</body>
</html>
